<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lily — links</title>
<meta name="description" content="Lily · exclusive content, Instagram and TikTok.">
<meta name="theme-color" content="#1A0F14">
<meta property="og:title" content="Lily">
<meta property="og:description" content="Exclusive content · links">
<meta property="og:type" content="profile">
<style>
  :root{
    --ground:#1A0F14;
    --ground-2:#241419;
    --card:rgba(255,255,255,.055);
    --line:rgba(255,238,230,.12);
    --cream:#F7ECE6;
    --muted:#C4A9A4;
    --peach:#F0A57C;
    --peach-2:#E8748A;
    --wine:#7A2E45;
    --serif:"Didot","Bodoni MT","Playfair Display",Georgia,"Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    min-height:100svh;
    font-family:var(--sans);
    color:var(--cream);
    background:
      radial-gradient(120% 70% at 50% -10%, rgba(232,116,138,.28), transparent 62%),
      radial-gradient(90% 60% at 85% 108%, rgba(240,165,124,.20), transparent 60%),
      linear-gradient(180deg,var(--ground) 0%, var(--ground-2) 100%);
    background-attachment:fixed;
    display:flex;justify-content:center;
    padding:clamp(28px,7vh,64px) 20px calc(32px + env(safe-area-inset-bottom));
  }
  .wrap{width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center;gap:26px}

  /* portrait */
  .portrait{position:relative;width:132px;height:132px;flex:none}
  .portrait::after{
    content:"";position:absolute;inset:-7px;border-radius:50%;
    background:conic-gradient(from 210deg,var(--peach),var(--peach-2),var(--wine),var(--peach));
    z-index:0;opacity:.9;
  }
  .portrait img{
    position:relative;z-index:1;width:100%;height:100%;border-radius:50%;
    object-fit:cover;border:4px solid var(--ground);display:block;
    background:var(--ground-2);
  }

  .identity{text-align:center;display:flex;flex-direction:column;gap:8px}
  .name{font-family:var(--serif);font-size:40px;font-weight:400;letter-spacing:.01em;line-height:1}
  .handle{font-size:13px;color:var(--muted);letter-spacing:.11em;text-transform:uppercase}
  .bio{font-size:15px;line-height:1.55;color:#E4CFC8;max-width:30ch;margin:2px auto 0}

  .links{width:100%;display:flex;flex-direction:column;gap:12px}

  a.btn{
    display:flex;align-items:center;gap:14px;width:100%;
    padding:17px 20px;border-radius:15px;text-decoration:none;color:var(--cream);
    background:var(--card);border:1px solid var(--line);
    font-size:16px;font-weight:600;letter-spacing:.01em;
    transition:transform .16s ease, background .16s ease, border-color .16s ease;
    -webkit-tap-highlight-color:transparent;
  }
  a.btn .ico{width:22px;height:22px;flex:none;opacity:.92}
  a.btn .arrow{margin-left:auto;opacity:.5;font-size:18px;line-height:1}
  a.btn:hover,a.btn:focus-visible{background:rgba(255,255,255,.10);border-color:rgba(255,238,230,.24);transform:translateY(-2px)}
  a.btn:focus-visible{outline:2px solid var(--peach);outline-offset:3px}
  a.btn:active{transform:translateY(0)}

  /* primary CTA */
  a.primary{
    background:linear-gradient(135deg,var(--peach) 0%,var(--peach-2) 100%);
    border-color:transparent;color:#2A0F18;font-weight:700;font-size:17px;
    padding:20px;box-shadow:0 10px 30px -10px rgba(232,116,138,.65);
  }
  a.primary .arrow{opacity:.65}
  a.primary:hover,a.primary:focus-visible{background:linear-gradient(135deg,#F4B18D 0%,#EE8397 100%);border-color:transparent}
  .primary-wrap{width:100%;display:flex;flex-direction:column;gap:7px}
  .primary-note{font-size:12px;color:var(--muted);text-align:center;letter-spacing:.03em}

  footer{margin-top:6px;display:flex;flex-direction:column;align-items:center;gap:7px}
  .badge{
    font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#9E8580;
    border:1px solid rgba(255,238,230,.14);border-radius:999px;padding:5px 11px;
  }
  .age{font-size:11px;color:#8A7370;letter-spacing:.04em}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
  <main class="wrap">

    <div class="portrait">
      <img src="https://pub-2e13ab406e304d3cbf98c31682a13b0a.r2.dev/MySnapFace-image-Dy1W2wF6BSpPe7yy.jpg" alt="Lily">
    </div>

    <div class="identity">
      <h1 class="name">Lily</h1>
      <div class="handle">@_be_lily_</div>
      <p class="bio">Dancing, smiling, and a little too much fun. The rest is behind the door below.</p>
    </div>

    <div class="links">

      <div class="primary-wrap">
        <a class="primary btn" data-fanvue href="https://www.fanvue.com/by_lily_/fv-3?utm_source=bio&utm_medium=link&utm_campaign=lily" target="_blank" rel="noopener">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7.5-4.7-9.5-9A5.3 5.3 0 0 1 12 6.5 5.3 5.3 0 0 1 21.5 12c-2 4.3-9.5 9-9.5 9z"/></svg>
          See more of me
          <span class="arrow">→</span>
        </a>
        <div class="primary-note">Photos & videos you won't see anywhere else</div>
      </div>

      <a class="btn" href="https://www.instagram.com/_be_lily_/" target="_blank" rel="noopener">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="5.5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.6" cy="6.4" r="1.2" fill="currentColor" stroke="none"/></svg>
        Instagram
        <span class="arrow">→</span>
      </a>

      <a class="btn" href="https://www.tiktok.com/@_by_lily" target="_blank" rel="noopener">
        <svg class="ico" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.6 5.8a5 5 0 0 1-3-2.8h-2.5v12.2a2.6 2.6 0 1 1-2.1-2.6V9.9a5.7 5.7 0 1 0 4.7 5.6V9.4a7.5 7.5 0 0 0 4.3 1.4V8.2a5 5 0 0 1-1.4-.3z"/></svg>
        TikTok
        <span class="arrow">→</span>
      </a>


    </div>

    <footer>
      <span class="age">18+</span>
    </footer>

  </main>

  <script>
    // Один и тот же файл обслуживает оба поддомена. Метку источника берём из хостнейма,
    // чтобы в Fanvue было видно, откуда пришёл переход — из TikTok или из Instagram.
    (function () {
      var SOURCES = {
        'lilys.msams.lol': 'tiktok',
        'lily.msams.lol': 'instagram'
      };
      var source = SOURCES[location.hostname];
      if (!source) return; // локально или на github.io оставляем utm_source=bio

      var link = document.querySelector('a[data-fanvue]');
      if (!link) return;
      var url = new URL(link.href);
      url.searchParams.set('utm_source', source);
      link.href = url.toString();
    })();
  </script>
</body>
</html>
